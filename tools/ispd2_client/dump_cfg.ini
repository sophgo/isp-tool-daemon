# dump_cfg.ini — dumpraw / dumpall 配置
# 部署位置：/mnt/data/dump_cfg.ini（客户端硬编码路径）
# 缺 key 或缺文件 → 使用默认值

# 抓帧数（非 tightly 模式只支持 1）
frames=1

# 多帧紧密打包（0=单帧，1=多帧连续 buffer 一次传出）
tightly=0

# 抓 ISP 寄存器 dump（Reg dump log）
dump_reg=1

# 抓 raw 像素数据（Data size / binary stream）
dump_raw=1

# 客户端是否把 raw 写到 dumpraw_<时间戳>/isp_dump.raw
#   0 = 只跑通链路 + 打印 header 统计，不落盘（排查用）
#   1 = 写文件（默认）
save_raw=1

# 是否把 Reg/Raw info/AE/AWB log 写到 dumpraw_<时间戳>/ 下的 4 个 .log 文件
#   0 = 只打印到 stdout
#   1 = 同时写文件（isp_reg_dump.log / isp_raw_info.log / isp_ae.log / isp_awb.log，默认）
save_log=1
