# isp_ut configuration
# Place this file in the same directory as the isp_ut binary.
#
# input: sensor | pattern (default: sensor)
#   sensor  - real sensor path: MIPI + sensor driver + pqbin for 3A tuning
#   pattern - VI pattern generator (no MIPI, no sensor driver)
#
# compress_mode: none | tile | line | frame (default: tile)
#   Controls VI channel DPCM compression.

input = sensor
compress_mode = none
